name: Release RestedRealm Companion

# Run from Actions > Release RestedRealm Companion > Run workflow. It builds the
# version in app/Cargo.toml, makes a DRAFT release v<version> with the files,
# and uploads a fixed-name copy for restedrealm.com's download button. Check
# the draft, then publish it: apps update only from published releases.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Tests before building
        run: cargo test
      - name: Turn on automatic updates for this build
        shell: bash
        env:
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$UPDATER_PUBKEY" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::Set the TAURI_UPDATER_PUBKEY variable and the TAURI_SIGNING_PRIVATE_KEY secret first (docs/RELEASING.md)."
            exit 1
          fi
          printf '{"bundle":{"createUpdaterArtifacts":true},"plugins":{"updater":{"pubkey":"%s"}}}' "$UPDATER_PUBKEY" > src-tauri/tauri.release.conf.json
      - name: Version from app/Cargo.toml
        id: version
        shell: bash
        run: echo "tag=v$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: RestedRealm Companion ${{ steps.version.outputs.tag }}
          releaseBody: |
            Download `RestedRealm-Companion-Setup.exe` below and run it. Windows 10 and 11.
            Already installed? The app updates itself; nothing to do.

            The installer is not yet code signed, so Windows may show "Windows protected your PC".
            Choose "More info" and then "Run anyway".
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
      - name: Fixed-name copy for the website's download button
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/release/bundle/nsis/*-setup.exe RestedRealm-Companion-Setup.exe
          gh release upload "${{ steps.version.outputs.tag }}" RestedRealm-Companion-Setup.exe --clobber --repo "${{ github.repository }}"
